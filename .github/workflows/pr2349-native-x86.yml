name: PR 2349 native x86 comparator experiment

on:
  push:
    branches:
      - bench/enum-containment-2349
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr2349-native-x86-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: Base, reported PR, current PR, and outlined enum candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out experiment harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build and measure on this machine
        shell: bash
        run: bash .github/scripts/pr2349-native-x86.sh

      - name: Preserve raw profiles and reproducibility information
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr2349-native-x86-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr2349-native-x86/results
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
